version: "3.8"

services:
  # ============================================================================
  # Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: memory-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web UI Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memory-network

  # ============================================================================
  # FastAPI Memory Engine Microservice
  # ============================================================================
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-engine-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - memory-network

volumes:
  qdrant_storage:
    driver: local

networks:
  memory-network:
    driver: bridge
