[project]
name = "self-learning-ai-agent"
version = "0.1.0"
description = "Self-Learning AI Agent Long-Term Memory Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "google-genai>=2.0.0",
    "openai>=1.40.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "src"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
